name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v<package-version> tag to publish
        required: true
        type: string

jobs:
  verify-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      statuses: read
    outputs:
      commit_sha: ${{ steps.release_ref.outputs.commit_sha }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        ref: ${{ github.event.release.tag_name || inputs.release_tag }}

    - name: Verify release tag matches package and checked-out commit
      id: release_ref
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
      run: |
        node scripts/check-release-ref.mjs "$RELEASE_TAG"
        echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # A release tag is not evidence that the tagged bytes passed CI. Require
    # both hosted workflows and the local Proton Bridge E2E attestation on the
    # exact immutable SHA resolved above. The checker rejects missing evidence,
    # a newer failed/in-progress run, and a Bridge status for any other commit.
    - name: Verify exact-SHA release attestations
      env:
        COMMIT_SHA: ${{ steps.release_ref.outputs.commit_sha }}
        GITHUB_API_URL: ${{ github.api_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node scripts/check-release-attestations.mjs "$COMMIT_SHA"

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies without lifecycle scripts
      run: npm ci --ignore-scripts

    - name: Rebuild trusted native dependencies
      run: npm rebuild better-sqlite3 @napi-rs/keyring

    - name: Run shared release verification
      run: npm run preship:fast

    # `preship:release` cannot run after tagging because its pre-tag
    # `git-tag-free` check would correctly fail. Run the tagged-release checks
    # that remain meaningful here; check-release-ref above is the stronger
    # post-tag replacement for git-tag-free, while the exact-SHA preship
    # attestation covers Greenmail and tarball validation.
    - name: Run tagged-release verification
      env:
        CHECK_CHANGELOG_BODY: "1"
      run: |
        npm run build:clean
        node scripts/check-version-sync.mjs

  publish-npm:
    needs: verify-release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.verify-release.outputs.commit_sha }}

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'

    # BUILD-011: `npm ci` runs every transitive's preinstall/install/postinstall
    # script with `id-token: write` and `NPM_TOKEN` in scope. A single
    # compromised transitive (next event-stream) could exfiltrate the publish
    # token via a `postinstall` exec. `--ignore-scripts` blocks the entire
    # lifecycle, then we rebuild ONLY the natives mailpouch actually depends on.
    # If you add another native dep (e.g. `bcrypt`, `keytar`), it must be added
    # to the `npm rebuild` line here, or its native binary won't be built.
    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Rebuild trusted native dependencies
      run: npm rebuild better-sqlite3 @napi-rs/keyring

    - name: Run type checking
      run: npm run typecheck

    - name: Run linter
      run: npm run lint

    - name: Run tests
      run: npm test

    - name: Build project
      run: npm run build

    - name: Publish to npm
      # Skip gracefully if this version is already published (manual publish case)
      run: |
        VERSION=$(node -p "require('./package.json').version")
        NAME=$(node -p "require('./package.json').name")
        if npm view "${NAME}@${VERSION}" version --registry https://registry.npmjs.org 2>/dev/null | grep -q "${VERSION}"; then
          echo "Version ${VERSION} already published to npm — skipping"
        else
          # --ignore-scripts: this job already ran typecheck/lint/test/build as
          # explicit steps, and verify-release required exact-SHA CI, Greenmail,
          # tarball, and Proton Bridge evidence. A bare `npm publish` would fire
          # the `prepublishOnly` hook
          # (`preship:release`), whose release tier runs e2e:greenmail (Docker)
          # and e2e:bridge — neither exists in this job, so it hangs. Skipping
          # lifecycle scripts here is also consistent with the BUILD-011
          # supply-chain rationale above (no untrusted script runs with the
          # publish token in scope). dist/ is already built by the step above.
          npm publish --provenance --access public --ignore-scripts
        fi
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-gpr:
    needs: verify-release
    runs-on: ubuntu-latest
    # Both registries share the same verification gate, while publishing
    # independently so one registry outage does not suppress the other.

    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ needs.verify-release.outputs.commit_sha }}

    - name: Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20.x'
        registry-url: 'https://npm.pkg.github.com'
        cache: 'npm'

    # BUILD-011: `npm ci` runs every transitive's preinstall/install/postinstall
    # script with `id-token: write` and `NPM_TOKEN` in scope. A single
    # compromised transitive (next event-stream) could exfiltrate the publish
    # token via a `postinstall` exec. `--ignore-scripts` blocks the entire
    # lifecycle, then we rebuild ONLY the natives mailpouch actually depends on.
    # If you add another native dep (e.g. `bcrypt`, `keytar`), it must be added
    # to the `npm rebuild` line here, or its native binary won't be built.
    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Rebuild trusted native dependencies
      run: npm rebuild better-sqlite3 @napi-rs/keyring

    - name: Build project
      run: npm run build

    - name: Publish to GitHub Packages
      # GitHub Packages npm requires scoped packages. Temporarily rename to
      # @chandshy/mailpouch for this publish only — does not affect npmjs.com.
      run: |
        VERSION=$(node -p "require('./package.json').version")
        if npm view "@chandshy/mailpouch@${VERSION}" version --registry https://npm.pkg.github.com 2>/dev/null | grep -q "${VERSION}"; then
          echo "Version ${VERSION} already published to GitHub Packages — skipping"
        else
          # BUILD-023: back up package.json, rename for the scoped GPR publish,
          # then restore — so any later step in this job sees the original,
          # unmutated workspace.
          cp package.json /tmp/pkg.bak
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.name = '@chandshy/mailpouch';
            p.publishConfig = { registry: 'https://npm.pkg.github.com', access: 'public' };
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "
          # --ignore-scripts: same rationale as the npm job — build already ran,
          # exact-SHA release evidence passed upstream, and a bare publish would
          # fire prepublishOnly → preship:release (E2E), which can't run here.
          npm publish --ignore-scripts
          mv /tmp/pkg.bak package.json
        fi
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
