name: Build native tray prebuilts

# Build the @mailpouch/tray-native .node prebuilts for every platform
# we support. Triggers manually (workflow_dispatch) and on every push
# that touches native/tray/ — typical workflow:
#
#   1. Edit something under native/tray/.
#   2. Push to a branch.
#   3. CI builds all 6 prebuilts in parallel, uploads them as
#      workflow artifacts.
#   4. Download the artifacts, drop them into native/tray/, commit
#      the new .node files, open a PR.
#
# The Linux x64 prebuilt is committed alongside source so a fresh
# `git clone` works for development without needing CI. Other
# platforms follow this CI-build-then-commit pattern until we have
# a separate npm-publishing job (see TODO at the end of this file).

on:
  push:
    paths:
      - 'native/tray/**'
      - '.github/workflows/build-native-tray.yml'
  pull_request:
    paths:
      - 'native/tray/**'
      - '.github/workflows/build-native-tray.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast: false — let every platform finish even if one
      # breaks; we want to know whether the breakage is target-specific
      # (toolchain quirk) or universal (Rust source bug).
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            arch_label: linux-x64-gnu
          # Built NATIVELY on an arm64 runner, not cross-compiled. See the
          # build-deps step below for why the cross-compile approach was dropped.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            arch_label: linux-arm64-gnu
          # Cross-compiled from the arm64 macOS runner. GitHub retired the
          # macos-13 Intel image, and that label no longer schedules at all —
          # this job sat queued forever (never once completed) and left the
          # whole workflow permanently incomplete. Unlike the Linux case this
          # cross-compile is safe and first-class: the macOS SDK ships both
          # slices and Apple's clang targets x86_64 from Apple silicon
          # natively, so no foreign sysroot or package mixing is involved.
          - target: x86_64-apple-darwin
            os: macos-latest
            arch_label: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            arch_label: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            arch_label: win32-x64-msvc
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            arch_label: win32-arm64-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Rust toolchain
        # dtolnay/rust-toolchain does not cut tags; `stable` is a branch ref.
        # Pinned to the current branch HEAD SHA. Bump manually when refreshing
        # the toolchain (see docs/audit-2026-05-28.md BUILD-012 follow-up).
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-29
        with:
          targets: ${{ matrix.target }}

      # Linux: dev headers required by tray-icon's C deps. Only
      # affects the build; end users don't need -dev packages,
      # just the runtime libs (which Ubuntu/Fedora ship by default).
      #
      # Both Linux targets install the SAME packages natively — x86_64 on
      # ubuntu-latest, arm64 on the ubuntu-24.04-arm runner. There is no
      # cross-compilation.
      #
      # This previously cross-compiled arm64 from an amd64 runner by adding
      # ports.ubuntu.com as an arm64 source and installing `:arm64` packages
      # alongside the host's amd64 ones. That is inherently fragile: shared
      # libraries like libssl3t64 are `Multi-Arch: same`, so apt requires the
      # :amd64 and :arm64 copies to be the *identical version* — but amd64
      # comes from archive.ubuntu.com and arm64 from ports.ubuntu.com, and the
      # two mirrors publish security/updates pockets at different times. Any
      # skew makes the arm64 dependency chain unsatisfiable and the job dies
      # with "held broken packages" (see #266):
      #
      #   libkrb5-3:arm64 : Depends: libssl3t64:arm64 (>= 3.0.0)
      #                     but it is not installable
      #
      # Nothing in this repo could fix that — it is a function of upstream
      # mirror timing, which is why the job flapped rather than failing
      # consistently. Building on a native arm64 runner removes the split
      # entirely: one architecture, one mirror, no version matching.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install napi-rs CLI
        working-directory: native/tray
        run: npm install --no-save @napi-rs/cli@^2.18.4

      - name: Build native addon
        working-directory: native/tray
        run: npx napi build --release --platform --target ${{ matrix.target }}

      - name: Verify .node was produced
        working-directory: native/tray
        shell: bash
        run: |
          set -e
          file=$(ls index.${{ matrix.arch_label }}.node 2>/dev/null || ls *.node | head -1)
          if [ -z "$file" ]; then
            echo "::error ::No .node artifact produced"
            exit 1
          fi
          echo "Built: $file ($(stat --printf='%s' "$file" 2>/dev/null || stat -f%z "$file") bytes)"

      - name: Upload prebuilt artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tray-${{ matrix.arch_label }}
          path: native/tray/index.${{ matrix.arch_label }}.node
          retention-days: 30

# TODO: separate publish job that triggers on a v* tag, downloads all
# artifacts, splits each into a @mailpouch/tray-native-<arch> package,
# and `npm publish`es them with `optionalDependencies` linkage from
# the main package. Pattern is napi-rs standard; needs an NPM_TOKEN
# secret on the repo before it can run.
