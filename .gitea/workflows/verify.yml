name: Fleet verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-verify-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  preship:
    name: preship and security
    runs-on: aiserver-runner
    timeout-minutes: 20
    env:
      PRESHIP_NO_BRIDGE: "1"
      MAILPOUCH_INSECURE_BRIDGE: "1"
      MAILPOUCH_E2E_GREENMAIL_EXTERNAL: "1"
      MAILPOUCH_E2E_GREENMAIL_HOST: greenmail
    services:
      greenmail:
        image: greenmail/standalone:2.1.4
        options: --network-alias greenmail
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp
            -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=alice:test-password@test.local,bob:test-password@test.local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: rm node_modules/better-sqlite3/prebuilds/linux-x64.node
      - run: npm rebuild better-sqlite3
      - run: npm run preship:fast
      - run: npm run test:e2e:local:keep
