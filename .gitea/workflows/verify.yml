name: Fleet verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-verify-greenmail
  cancel-in-progress: false

jobs:
  preship:
    name: preship and security
    runs-on: aiserver-runner
    timeout-minutes: 20
    env:
      PRESHIP_NO_BRIDGE: "1"
      MAILPOUCH_INSECURE_BRIDGE: "1"
      MAILPOUCH_E2E_GREENMAIL_EXTERNAL: "1"
      MAILPOUCH_E2E_GREENMAIL_HOST: mailpouch-greenmail
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: npm
      - run: npm ci
      - run: rm node_modules/better-sqlite3/prebuilds/linux-x64.node
      - run: npm rebuild better-sqlite3
      - run: npm run preship:fast
      - name: Reset shared GreenMail
        run: |
          node -e "fetch('http://mailpouch-greenmail:8080/api/service/reset',{method:'POST'}).then(async r=>{if(!r.ok)throw new Error('GreenMail reset failed: '+r.status);console.log(await r.text())})"
          node scripts/wait-for-port.mjs mailpouch-greenmail 3143 30
      - run: npm run test:e2e:local:keep
